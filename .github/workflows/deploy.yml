# Builds and deploys the site to GitHub Pages from `main` only.
# Requires Pages to be enabled with source "GitHub Actions" (owner approval);
# until then this workflow is not on `main` and never runs. It does not
# enable Pages or change any repository setting itself.
# Rollback: revert the bad commit on `main`; the push redeploys. See README.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *' # 06:17 Africa/Windhoek — refreshes github.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run check:disclosure
      - name: Fetch public GitHub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # A failed daily refresh must not replace good live data with the
          # fallback panel, so only scheduled runs fail on an API error.
          STRICT: ${{ github.event_name == 'schedule' && '--strict' || '' }}
        run: npm run data:github -- $STRICT
      - run: npm run build
      - run: node scripts/check-disclosure.mjs --dir dist
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
