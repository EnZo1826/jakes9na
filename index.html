<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />

    <!--
      Content-Security-Policy: self-only for every fetch directive. The one
      documented exception is connect-src 'self', which is required so
      GithubActivity can fetch `<base>/data/github.json` — that file is served
      from this same origin (public/data/github.json), generated by a
      separate CI job; no third-party origin is ever contacted.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'"
    />

    <title>Jakes9NA — Engineering intelligent systems</title>
    <meta
      name="description"
      content="Jakes9NA, Windhoek, Namibia: industrial automation, IoT and edge computing, full-stack and offline-first applications, telemetry dashboards, ERP integration and practical AI engineering."
    />
    <link rel="canonical" href="https://enzo1826.github.io/jakes9na/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jakes9NA — Engineering intelligent systems" />
    <meta
      property="og:description"
      content="Jakes9NA, Windhoek, Namibia: industrial automation, IoT and edge computing, full-stack and offline-first applications, telemetry dashboards, ERP integration and practical AI engineering."
    />
    <meta property="og:image" content="https://enzo1826.github.io/jakes9na/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="https://enzo1826.github.io/jakes9na/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/og-image.svg" />
  </head>
